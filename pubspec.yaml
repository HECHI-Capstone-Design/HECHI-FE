name: hechi
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  http: ^1.6.0
  http_parser: ^4.0.2
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.0
  get_storage: ^2.1.1
  mobile_scanner: ^5.2.3
  google_fonts: ^6.2.1
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  image_picker: ^1.0.7
  flutter_slidable: ^4.0.3
  permission_handler: ^12.0.3
  flutter_local_notifications: ^20.1.0
  flutter_dotenv: ^5.1.0

  google_mlkit_text_recognition: ^0.15.1
  mobile_ocr_flutter:
    path: packages/mobile_ocr_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - .env
