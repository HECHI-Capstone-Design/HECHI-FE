name: hechi
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  http: ^1.6.0
  intl: ^0.20.2
  flutter_rating_bar: ^4.0.0
  get_storage: ^2.1.1
  mobile_scanner: ^5.2.3
  google_fonts: ^6.2.1
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  image_picker: ^1.0.7
  google_mlkit_text_recognition: ^0.15.1
  flutter_reactive_ble: ^5.4.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  flutter_slidable: ^4.0.3
  mobile_ocr_flutter:
    path: packages/mobile_ocr_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # 1. 이미지 및 아이콘 경로
  assets:
    - assets/icons/

  # 2. 폰트 등록 (들여쓰기 주의!)
  fonts:
    - family: MoveSans
      fonts:
        - asset: assets/fonts/MoveSans.ttf
